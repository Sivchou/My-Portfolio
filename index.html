a{color:inherit;}
img,svg{max-width:100%;}

/* ---------- MODE TOGGLE ---------- */
.mode-bar{position:sticky; top:0; top:env(safe-area-inset-top,0px); z-index:20; display:flex; justify-content:center;
  padding:8px; background:#050505; border-bottom:1px solid #2a2a2a;}
.toggle{position:relative; display:inline-flex; background:#1a1a1a; border:1px solid #3a3a3a; border-radius:999px; padding:3px; gap:2px;}
.toggle .highlight{position:absolute; top:3px; left:3px; bottom:3px; width:calc(50% - 4px); border-radius:999px;
  background:var(--gold); transition:transform .35s cubic-bezier(.65,0,.35,1), background .35s; z-index:0;
  transform:translateX(calc(100% + 4px));}
[data-mode="boring"] .toggle .highlight{transform:translateX(0); background:var(--boring-accent);}
.toggle button{position:relative; z-index:1; border:none; background:transparent; color:#999; font-family:'Oswald',sans-serif; font-size:12px;
  letter-spacing:.5px; padding:7px 16px; border-radius:999px; cursor:pointer; transition:color .25s, transform .15s;}
.toggle button:active{transform:scale(.93);}
.toggle button.active{color:#111; font-weight:600;}
[data-mode="boring"] .toggle button.active{color:#fff;}

/* ---------- HERO ---------- */
.wall{
  padding:52px 16px 60px; display:flex; flex-direction:column; align-items:center; gap:26px;
}

.sign-frame{
  max-width:820px; width:100%;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 11px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 1px, transparent 1px 11px),
    var(--gray-frame);
  padding:9px; box-shadow:0 12px 34px rgba(0,0,0,.55);
  filter:sepia(.16) contrast(1.05) brightness(.97) saturate(.92);
}
.sign-ribbon{
  display:grid; grid-template-columns:22px 1fr 22px; grid-template-rows:26px 1fr 26px;
  background:var(--navy);
}
.sign-ribbon .corner{background:var(--navy);}
.sign-ribbon .edge-h{background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSIyNiI+PHJlY3Qgd2lkdGg9IjYwIiBoZWlnaHQ9IjI2IiBmaWxsPSIjMWYyZDRkIi8+PHBhdGggZD0iTTAgMTYgQzEwIDQsMjAgMjgsMzAgMTYgQzQwIDQsNTAgMjgsNjAgMTYiIHN0cm9rZT0iI2M5YTIyNyIgc3Ryb2tlLXdpZHRoPSI1IiBmaWxsPSJub25lIi8+PGVsbGlwc2UgY3g9IjE1IiBjeT0iOSIgcng9IjQiIHJ5PSI3IiBmaWxsPSIjY2Y5Zjk2IiB0cmFuc2Zvcm09InJvdGF0ZSgyMCAxNSA5KSIvPjxlbGxpcHNlIGN4PSI0NSIgY3k9IjIzIiByeD0iNCIgcnk9IjciIGZpbGw9IiNjZjlmOTYiIHRyYW5zZm9ybT0icm90YXRlKC0yMCA0NSAyMykiLz48L3N2Zz4='); background-repeat:repeat-x; background-size:60px 26px;}
.sign-ribbon .edge-v{background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNiIgaGVpZ2h0PSI2MCI+PHJlY3Qgd2lkdGg9IjI2IiBoZWlnaHQ9IjYwIiBmaWxsPSIjMWYyZDRkIi8+PHBhdGggZD0iTTE2IDAgQzQgMTAsMjggMjAsMTYgMzAgQzQgNDAsMjggNTAsMTYgNjAiIHN0cm9rZT0iI2M5YTIyNyIgc3Ryb2tlLXdpZHRoPSI1IiBmaWxsPSJub25lIi8+PGVsbGlwc2UgY3g9IjkiIGN5PSIxNSIgcng9IjciIHJ5PSI0IiBmaWxsPSIjY2Y5Zjk2IiB0cmFuc2Zvcm09InJvdGF0ZSgyMCA5IDE1KSIvPjxlbGxpcHNlIGN4PSIyMyIgY3k9IjQ1IiByeD0iNyIgcnk9IjQiIGZpbGw9IiNjZjlmOTYiIHRyYW5zZm9ybT0icm90YXRlKC0yMCAyMyA0NSkiLz48L3N2Zz4='); background-repeat:repeat-y; background-size:26px 60px;}
.sign-ribbon .panel{background:var(--panel); padding:16px 10px; cursor:pointer;}

.mosaic-wrap{width:100%; display:flex; justify-content:center;}
#mosaic{display:grid; gap:clamp(1px,.3vw,3px); width:100%; max-width:720px;}
.tile{aspect-ratio:1/1; border-radius:1px;}
.tile.on{background:var(--tile-white); cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), inset 0 -2px 2px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .08s;}
.tile.on:hover{transform:scale(1.15);}
.tile.on:focus-visible{outline:2px solid var(--gold); outline-offset:1px;}
.tile.off{background:transparent;}

.strip{display:flex; height:16px;}
.strip span{flex:1;}
.strip.checker span:nth-child(odd){background:var(--mauve);}
.strip.checker span:nth-child(even){background:var(--navy);}
.strip.oval{align-items:center; height:22px; gap:2px; padding:0 2px; background:var(--panel);}
.strip.oval .eye{flex:2; height:14px; border-radius:50%; background:var(--gold); border:2px solid #2a2116;}
.strip.oval .sq{flex:1; height:10px; background:var(--navy); border:2px solid var(--mauve);}

.sign-caption{text-align:center; color:#c9c3b0; font-size:11px; letter-spacing:1.5px; margin-top:2px; text-transform:uppercase;}

/* ---------- WELCOME PHOTO BUTTON ---------- */
.welcome-panel{display:block; width:100%; padding:0; border:none; background:none; cursor:pointer; overflow:hidden; line-height:0;}
.welcome-panel img{display:block; width:100%; height:auto; transition:transform .3s ease, filter .3s ease;}
.welcome-panel:hover img{transform:scale(1.02); filter:brightness(1.1);}
.welcome-caption{text-align:center; color:#c9c3b0; font-size:11px; letter-spacing:1.5px; margin-top:2px; text-transform:uppercase;}

/* ---------- GALLERY PAGE ---------- */
.page-gallery{max-width:820px; width:100%; text-align:center; padding:70px 20px;}
.back-btn{background:none; border:2px solid var(--gold); color:var(--cream); font-family:'Oswald',sans-serif;
  font-size:12px; letter-spacing:1.5px; text-transform:uppercase; padding:8px 18px; border-radius:999px; cursor:pointer; margin-bottom:30px;}
.back-btn:hover{background:var(--gold); color:#111;}
.gallery-title{font-family:'Anton',sans-serif; font-size:clamp(28px,6vw,44px); letter-spacing:1px; color:var(--cream); margin:0 0 14px; text-transform:uppercase;}
.gallery-placeholder{color:#c9c3b0; font-size:15px; letter-spacing:.5px;}
[data-page="gallery"] #page-home{display:none;}
[data-page="home"] #page-gallery{display:none;}

/* ---------- BORING MODE (intentionally blank) ---------- */
html[data-mode="boring"], html[data-mode="boring"] body{background-image:none; background-color:var(--boring-bg);}
[data-mode="boring"] .wall, [data-mode="boring"] .fun-only{display:none;}
[data-mode="boring"] .boring-only{display:block;}
.boring-only{display:none; min-height:calc(100vh - 60px);}
</style>
</head>
<body>

<div class="mode-bar">
  <div class="toggle" data-mode-toggle>
    <span class="highlight"></span>
    <button id="btn-boring">boring mode :|</button>
    <button id="btn-fun" class="active">fun mode :]</button>
  </div>
</div>

<div class="fun-only">
<div class="wall">
  <div id="page-home">
    <div class="sign-frame">
      <div class="sign-ribbon">
        <div class="corner"></div><div class="edge-h"></div><div class="corner"></div>
        <div class="edge-v"></div>
        <div class="panel" id="panel">
          <div class="mosaic-wrap"><div id="mosaic"></div></div>
        </div>
        <div class="edge-v"></div>
        <div class="corner"></div><div class="edge-h"></div><div class="corner"></div>
      </div>
      <div class="strip checker" id="checker"></div>
      <div class="strip oval" id="oval"></div>
    </div>
    <p class="sign-caption">click a tile — or the background — to change its color</p>

<script>
const LETTERS = {
  S: ["01111","10000","10000","01110","00001","00001","11110"],
  I: ["11111","00100","00100","00100","00100","00100","11111"],
  V: ["10001","10001","10001","10001","10001","01010","00100"],
  R: ["11110","10001","10001","11110","10100","10010","10001"],
  W: ["10001","10001","10001","10101","10101","11011","10001"],
  E: ["11111","10000","10000","11110","10000","10000","11111"],
  L: ["10000","10000","10000","10000","10000","10000","11111"],
  C: ["01111","10000","10000","10000","10000","10000","01111"],
  O: ["01110","10001","10001","10001","10001","10001","01110"],
  M: ["10001","11011","10101","10101","10001","10001","10001"],
  T: ["11111","00100","00100","00100","00100","00100","00100"],
  Y: ["10001","10001","01010","00100","00100","00100","00100"],
  P: ["11110","10001","10001","11110","10000","10000","10000"],
  F: ["11111","10000","10000","11110","10000","10000","10000"]
};
const GAP = "0", SPACE = "000";

function buildLine(word){
  const rows = ["","","","","","",""];
  const parts = word.split("");
  parts.forEach((ch, idx) => {
    const glyph = ch === " " ? Array(7).fill(SPACE) : LETTERS[ch];
    for (let r = 0; r < 7; r++){ rows[r] += glyph[r]; if (idx < parts.length - 1) rows[r] += GAP; }
  });
  return { rows, width: rows[0].length };
}
function buildBlock(lines, gapRows){
  const blocks = lines.map(buildLine);
  const w = Math.max(...blocks.map(b => b.width));
  let all = [];
  blocks.forEach((b, i) => {
    b.rows.forEach(r => all.push(r.padEnd(w, "0")));
    if (i < blocks.length - 1) for (let g = 0; g < gapRows; g++) all.push("0".repeat(w));
  });
  return { rows: all, width: w };
}

const tileColors = ['var(--tile-white)','var(--tile-gold)','var(--tile-maroon)','var(--tile-navy)','var(--tile-off)'];

function renderMosaic(id, block){
  const el = document.getElementById(id);
  el.style.gridTemplateColumns = `repeat(${block.width}, 1fr)`;
  el.style.gridTemplateRows = `repeat(${block.rows.length}, 1fr)`;
  block.rows.forEach(rowStr => {
    rowStr.split("").forEach(bit => {
      const cell = document.createElement('div');
      if (bit === "1"){
        cell.className = 'tile on';
        cell.style.background = tileColors[0];
        cell.dataset.idx = "0";
        cell.tabIndex = 0;
        cell.setAttribute('role','button');
        cell.setAttribute('aria-label','mosaic tile, click to change color');
        const rot = (Math.random()*8 - 4).toFixed(1);
        const scl = (0.9 + Math.random()*0.16).toFixed(2);
        const bri = (0.88 + Math.random()*0.22).toFixed(2);
        cell.style.transform = `rotate(${rot}deg) scale(${scl})`;
        cell.style.filter = `brightness(${bri})`;
        const cycle = (e) => {
          e.stopPropagation();
          const next = (parseInt(cell.dataset.idx,10)+1) % tileColors.length;
          cell.dataset.idx = String(next);
          cell.style.background = tileColors[next];
        };
        cell.addEventListener('click', cycle);
        cell.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' '){ e.preventDefault(); cycle(e); } });
      } else { cell.className = 'tile off'; }
      el.appendChild(cell);
    });
  });
}
function attachPanelCycle(id){
  const panel = document.getElementById(id);
  const panelColors = ['#0c0c0c','#3a1414','#132a3a','#1e2a1a','#2a1c0c'];
  let idx = 0;
  panel.addEventListener('click', () => { idx = (idx+1) % panelColors.length; panel.style.background = panelColors[idx]; });
}

renderMosaic('mosaic', buildLine('SIV R'));
attachPanelCycle('panel');

const checker = document.getElementById('checker');
for (let i=0;i<30;i++){ checker.appendChild(document.createElement('span')); }

const oval = document.getElementById('oval');
for (let i=0;i<9;i++){
  const eye = document.createElement('span'); eye.className='eye'; oval.appendChild(eye);
  const sq = document.createElement('span'); sq.className='sq'; oval.appendChild(sq);
}

const root = document.documentElement;
const btnBoring = document.getElementById('btn-boring');
const btnFun = document.getElementById('btn-fun');
function setMode(mode){
  root.setAttribute('data-mode', mode);
  btnBoring.classList.toggle('active', mode==='boring');
  btnFun.classList.toggle('active', mode==='fun');
  try{ localStorage.setItem('siv-mode', mode); }catch(e){}
}
btnBoring.addEventListener('click', () => setMode('boring'));
btnFun.addEventListener('click', () => setMode('fun'));
try{
  const saved = localStorage.getItem('siv-mode');
  if (saved) setMode(saved);
}catch(e){}

function setPage(page){
  root.setAttribute('data-page', page);
  try{ localStorage.setItem('siv-page', page); }catch(e){}
}
document.getElementById('welcome-btn').addEventListener('click', () => setPage('gallery'));
document.getElementById('back-btn').addEventListener('click', () => setPage('home'));

</script>
